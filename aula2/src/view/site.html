<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Funcionário</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="text-center mb-0">Cadastro de Funcionário</h2>
            </div>

            <div class="card-body">

                <div class="mb-3">
                    <label for="matricula" class="form-label">
                        Digite a matrícula:
                    </label>

                    <input type="number"
                           class="form-control"
                           id="matricula"
                           placeholder="Ex: 12345">
                </div>

                <div class="mb-3">
                    <label for="salarioBase" class="form-label">
                        Digite o salário base:
                    </label>

                    <input type="number"
                           class="form-control"
                           id="salarioBase"
                           step="0.01"
                           placeholder="Ex: 2500.00">
                </div>

                <div class="mb-3">
                    <label for="codigoFuncao" class="form-label">
                        Digite o código da função:
                    </label>

                    <div class="form-text mb-2">
                        Digite 100, 300, 400 ou 600.
                    </div>

                    <input type="number"
                           class="form-control"
                           id="codigoFuncao"
                           placeholder="Ex: 100">
                </div>

<div class="mb-3">
    <label for="codigoFuncao" class="form-label">
        Código da função:
    </label>

    <select class="form-select" id="codigoFuncao">
        <option selected>Selecione uma função</option>
        <option value="100">100</option>
        <option value="300">300</option>
        <option value="400">400</option>
        <option value="600">600</option>
    </select>
</div>


                <div class="d-grid">
                    <button type="button" class="btn btn-primary">
                        Enviar
                    </button>
                </div>

            </div>
        </div>

    </div>

</body>

</html>
